services:
  argus:
    build: .
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - BPF
      - NET_ADMIN
    read_only: true
    volumes:
      - ./configs:/app/configs:ro
    environment:
      ARGUS_INTERFACE: ${ARGUS_INTERFACE-eth0}
      ARGUS_COLLECT_INTERVAL: ${ARGUS_COLLECT_INTERVAL-5s}
      ARGUS_MAP_CAPACITY: ${ARGUS_MAP_CAPACITY-100000}
      ARGUS_LISTEN_ADDR: ${ARGUS_LISTEN_ADDR-127.0.0.1:9090}
      ARGUS_LOG_LEVEL: ${ARGUS_LOG_LEVEL-info}
      ARGUS_LOG_FORMAT: ${ARGUS_LOG_FORMAT-json}
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
