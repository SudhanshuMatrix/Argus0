apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: argus
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: argus
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: argus
    spec:
      hostNetwork: true
      automountServiceAccountToken: false
      containers:
        - name: argus
          image: argus:local
          imagePullPolicy: IfNotPresent
          args:
            - "--config=/etc/argus/config.yaml"
            - "--interface=$(NODE_INTERFACE)"
          env:
            - name: NODE_INTERFACE
              value: eth0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - BPF
                - NET_ADMIN
            readOnlyRootFilesystem: true
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: 9090
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: 9090
            periodSeconds: 30
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /readyz
              port: 9090
            periodSeconds: 5
            failureThreshold: 1
          volumeMounts:
            - name: config
              mountPath: /etc/argus
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: argus-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-config
  namespace: monitoring
data:
  config.yaml: |
    agent:
      interface: eth0
      collect_interval: 5s
      map_capacity: 100000
    prometheus:
      listen_addr: 127.0.0.1:9090
    logging:
      level: info
      format: json
